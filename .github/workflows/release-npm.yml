name: Publish packages to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the monorepo
        run: pnpm build

      - name: Publish public packages to npm
        run: |
          for dir in packages/cli packages/motion packages/registry packages/themes packages/three packages/ui; do
            echo "Publishing $dir..."
            (cd "$dir" && pnpm publish --access public --no-git-checks) || echo "Warning: publish failed or already published for $dir"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
